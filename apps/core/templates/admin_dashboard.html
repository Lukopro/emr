<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Dashboard</title>
    {% load static %}
    <link rel="stylesheet" href = "{% static 'global.css' %}" />
    <link rel="stylesheet" href = "{% static 'admin_dashboard.css' %}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="navbar">
    <div class="nav-left">
        <h1>HealthPath</h1>
        <button class ="menu-btn" onclick="logout()">☰</button>
    </div>
    <div class="nav-right">
      <button class = "icon-btn"><i class = "fa-solid fa-bell"></i></button>
      <div class = "role-badge" id="user-role">placeholder role</div>
      <div class ="avatar" id="user-avatar"></div>
    </div>

</div>
<div class="hero">
    <div class="hero-welcome" id ="greeting">placeholder greeting</div>
    <div class="hero-sub" id ="current-date">placeholder date</div>
        <div class="search-wrapper">
        <i class = "fa-solid fa-magnifying-glass search-icon"></i>
        <input class ="search-bar" type="text" placeholder="Search patients by name or ID...">
    </div>
    </div>
<div class="register-card">
<div class="register-left">
    <i class="fa-solid fa-user-plus register-icon"></i>
    <span>Register new staff member</span>
</div>
<button class="register-btn" onclick="openAddStaffModal()">Register</button>
</div>
<div class = "main-content">
    <div class = "left-column">
        <div class="section-card">
            <div class = "section-header">      
            <span> System activity & audit log </span>
            <a href ="#"> View full log</a>
        </div>
        <p class="placeholder-text">No recent activity</p>
    </div>
    
    </div>

    <div class = "right-column">
        <div class="section-card">
            <div class = "section-header">      
            <span> Notifications </span>
            <a href ="#"> Mark all read</a>
        </div>
        <p class="placeholder-text">No notifications</p>
    </div>
    </div>
  </div>

  <div class="modal-overlay" id="add-staff-modal" style="display: none;">
    <div class="modal">
        <div class="modal-header">
            <h2>Register New Staff Member</h2>
            <button class="modal-close" onclick="closeAddStaffModal()">
                <i class="fa-solid fa-x"></i>
            </button>
        </div>
       <form method="POST" action="{% url 'create_clinical_staff' %}">
    {% csrf_token %}

    <div class="modal-body">
        <div class="input-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="Username" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Password" required>
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="Email address" required>
        </div>

        <div class="input-group">
            <label>Phone Number</label>
            <input type="tel" name="phone" placeholder="Phone number" required>
        </div>

        <div class="input-group">
            <label>License Number</label>
            <input type="text" name="license_number" placeholder="License number" required>
        </div>

        <div class="input-group">
            <label>Specialization</label>
            <input type="text" name="specialization" placeholder="Physician, Nurse, etc." required>
        </div>

        <div class="input-group">
            <label>Hire Date</label>
            <input type="date" name="hire_date" required>
        </div>
    </div>

    <div class="modal-actions">
        <button type="button" class="cancel-btn" onclick="closeAddStaffModal()">Cancel</button>
        <button type="submit" class="confirm-btn">Register Staff</button>
    </div>
</form>
    </div>
    </div>
    <script>
        function openAddStaffModal() {
            document.getElementById('add-staff-modal').style.display = 'flex';
        }
        
        function closeAddStaffModal() {
            document.getElementById('add-staff-modal').style.display = 'none';
        }

       
    function logout(){
        window.location.href = "{% url 'logout' %}";
    }
    </script>
</body>
</html>
